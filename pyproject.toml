[project]
name = "libref"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kkkqkx123", email = "kkkqkx123@noreply.gitlab.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dulwich>=0.22",
    "fastapi>=0.162.2",
    "httpx[http2]>=0.27",
    "jieba>=0.42.1",
    "markdownify>=0.13",
    "mcp>=1.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.20.0",
    "selectolax>=0.3",
    "tree-sitter>=0.24",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.23",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
libref = "libref.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.47"]      # 反爬兜底（tech-stack §6 P1），默认不装；crawler/browser.py 延后实现

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure in-memory tests, no DB or subprocess",
    "integration: needs sqlite, subprocess or external service",
    "e2e: needs real network (repos/registries), default skipped unless LIBREF_RUN_E2E=1",
    "requires_qdrant: needs localhost Qdrant service",
    "requires_binary: needs built libref entrypoint",
]

[tool.ruff.lint.per-file-ignores]
# 夹具是待解析的源样本，刻意含未定义调用与闲置绑定，不做清理。
"tests/fixtures/**" = ["F821", "F841"]
"tests/e2e/fixtures/**" = ["F821", "F841"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
