[project]
name = "libref"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kkkqkx123", email = "kkkqkx123@noreply.gitlab.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.20.0",
]

[project.scripts]
libref = "libref:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
