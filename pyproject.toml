[project]
name = "libref"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kkkqkx123", email = "kkkqkx123@noreply.gitlab.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dulwich>=0.22",
    "fastapi>=0.162.2",
    "httpx[http2]>=0.27",
    "jieba>=0.42.1",
    "jsonschema>=4.26.0",
    "markdownify>=0.13",
    "mcp>=2.3.0",
    "psycopg>=3.3.9",
    "psycopg-binary>=3.3.9",
    "psycopg-pool>=3.3.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "qdrant-client>=1.20.0",
    "selectolax>=0.3",
    "tree-sitter>=0.24",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-groovy",
    "tree-sitter-java>=0.23",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-kotlin",
    "tree-sitter-python>=0.23",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
libref = "libref.cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.47"]      # 反爬兜底（tech-stack §6 P1），默认不装；crawler/browser.py 延后实现
postgres = [
    "psycopg>=3.3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 基准下载物（第三方仓库克隆）不参与收集
norecursedirs = ["tests/e2e/bench/fixtures", "tests/e2e/repos", ".venv"]
markers = [
    "unit: pure in-memory tests, no DB or subprocess",
    "integration: needs sqlite, subprocess or external service",
    "e2e: needs real network (repos/registries), default skipped unless LIBREF_RUN_E2E=1",
    "requires_qdrant: needs localhost Qdrant service",
    "requires_simvec: needs built libsimvec from crates/simvec",
    "requires_binary: needs built libref entrypoint",
    "performance: opt-in performance benchmarks, default skipped unless LIBREF_RUN_PERF=1",
]

[tool.ruff]
# Explicit main config; target-version is inferred from requires-python.
# Do not set target-version = "py314": ruff 0.6.9 rejects the unknown variant.
line-length = 88
src = ["src", "tests", "packages/librefctl/src"]

[tool.ruff.lint.per-file-ignores]
# 夹具是待解析的源样本，刻意含未定义调用与闲置绑定，不做清理。
"tests/fixtures/**" = ["F821", "F841"]
"tests/e2e/fixtures/**" = ["F821", "F841"]
# Web 层：B008 是 FastAPI 依赖注入的惯用法（Depends 作默认参数）；
# RUF059 是 _req_bundle 四元组解包的占位变量，按端点取用子集。
"src/libref/web/**" = ["B008", "RUF059"]

[tool.uv.workspace]
members = [
    "packages/librefctl",
    "vendor/tree-sitter-groovy",
    "vendor/tree-sitter-kotlin",
]

[tool.uv.sources]
librefctl = { workspace = true, editable = true }
tree-sitter-groovy = { workspace = true, editable = true }
tree-sitter-kotlin = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "librefctl",
    "mypy>=1.11",
    "numpy>=2.5.4",
    "pytest>=8",
    "ruff>=0.17,<0.18",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
