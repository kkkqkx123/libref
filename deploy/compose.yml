# Example compose stack: libref service + Qdrant, data on named volumes.
# Secrets come from an env file, never baked into the image.
services:
  libref:
    build: .
    image: libref:latest
    restart: unless-stopped
    env_file:
      - ./libref.env          # LIBREF_* variables incl. bootstrap key; never commit real values
    environment:
      LIBREF_DB_PATH: /data/libref.db
      LIBREF_SNAPSHOT_DIR: /data/snapshots
      LIBREF_REPOS_DIR: /data/repos
    volumes:
      - libref-data:/data
    ports:
      - "127.0.0.1:8931:8931" # loopback only; expose via the reverse proxy
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8931/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    # Not published to the host: reachable only inside the compose network.
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': < /dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  libref-data:
  qdrant-data:
