[project]
name = "librefctl"
version = "0.1.0"
description = "HTTP-only CLI client for libref servers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
librefctl = "librefctl.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "librefctl"
module-root = "src"
